name: pBTC e2e (regtest genesis + inclusion proof)

# Deterministic end-to-end harness for the SPV deposit path: a regtest Bitcoin
# node + a local hardhat EVM + the deployed LightRelay, driven through
# genesis -> tx -> SPV merkle inclusion proof -> on-chain BitcoinTx.validateProof
# (via TestBitcoinTx) by apps/pbtc-relay-maintainer/src/e2e/genesis-inclusion.ts.
# Regtest uses constant minimum difficulty, so this covers genesis + inclusion,
# not the difficulty threshold or per-epoch retarget (docs/SECURITY-ROADMAP.md §7).

on:
  pull_request:
    paths:
      - "apps/pbtc-relay-maintainer/**"
      - "solidity/contracts/relay/**"
      - "solidity/contracts/bridge/BitcoinTx.sol"
      - "solidity/contracts/test/TestBitcoinTx.sol"
      - "solidity/scripts/deploy-e2e-spv-verifier.ts"
      - "solidity/deploy/**"
      - "system-tests/regtest/**"
      - ".github/workflows/pbtc-e2e.yml"
  workflow_dispatch:

jobs:
  regtest-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BITCOIND_RPC_URL: http://127.0.0.1:18443
      BITCOIND_RPC_USER: pbtc
      BITCOIND_RPC_PASS: pbtc
      EVM_RPC_URL: http://127.0.0.1:8545
      # Well-known hardhat account #1 — local only, never a real key. It must be
      # account #1: on `localhost` the `deployer` named account defaults to index
      # 1 (solidity/hardhat.config.ts), so #1 owns the LightRelay and only the
      # owner may call `genesis`.
      MAINTAINER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      PROOF_LENGTH: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Start regtest bitcoind
        run: docker compose -f system-tests/regtest/docker-compose.regtest.yml up -d

      - name: Wait for bitcoind RPC
        run: |
          for i in $(seq 1 30); do
            if curl -s --user "$BITCOIND_RPC_USER:$BITCOIND_RPC_PASS" \
              --data-binary '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
              -H 'content-type: text/plain;' "$BITCOIND_RPC_URL/" | grep -q '"result"'; then
              echo "bitcoind ready"; exit 0
            fi
            sleep 2
          done
          echo "bitcoind did not become ready"; exit 1

      # Same as contracts.yml: a transitive solidity dependency is fetched via
      # unauthenticated `git://`, which GitHub no longer serves.
      - name: Configure git to don't use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      # --ignore-engines: hardhat 2.12.5 declares node <=18, but compile, unit
      # tests and deploy all run fine on the Node 20 this job uses.
      - name: Install solidity deps
        working-directory: ./solidity
        run: yarn install --frozen-lockfile --ignore-engines

      # Compile up front: otherwise `hardhat node` compiles everything before it
      # starts listening, which outlasts the readiness wait below.
      - name: Compile contracts
        working-directory: ./solidity
        run: npx hardhat compile

      - name: Start hardhat node + deploy LightRelay and SPV verifier
        working-directory: ./solidity
        run: |
          # --no-deploy: hardhat-deploy would otherwise run every deploy script
          # on startup; only the LightRelay (and the verifier) are needed here.
          npx hardhat node --no-deploy > hardhat-node.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -s -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              "$EVM_RPC_URL" | grep -q '"result"'; then
              ready=1; echo "hardhat node ready"; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then echo "hardhat node did not become ready"; exit 1; fi
          npx hardhat deploy --network localhost --tags LightRelay
          echo "RELAY_ADDRESS=$(node -e "console.log(require('./deployments/localhost/LightRelay.json').address)")" >> "$GITHUB_ENV"
          npx hardhat run --no-compile scripts/deploy-e2e-spv-verifier.ts --network localhost \
            | grep '^SPV_VERIFIER_ADDRESS=0x' >> "$GITHUB_ENV"

      - name: Install relay-maintainer deps
        working-directory: ./apps/pbtc-relay-maintainer
        run: npm ci

      - name: Run genesis + inclusion-proof e2e
        working-directory: ./apps/pbtc-relay-maintainer
        run: npm run e2e:regtest

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "::group::hardhat node"; cat solidity/hardhat-node.log || true; echo "::endgroup::"
          echo "::group::bitcoind"; docker compose -f system-tests/regtest/docker-compose.regtest.yml logs || true; echo "::endgroup::"

      - name: Tear down regtest
        if: always()
        run: docker compose -f system-tests/regtest/docker-compose.regtest.yml down -v || true
